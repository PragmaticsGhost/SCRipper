services:
  scripper:
    build: .
    image: scripper-suite:latest
    container_name: scripper-suite
    ports:
      # Bound to localhost only — this app is for personal use and must
      # not be exposed publicly (it downloads with YOUR cookies).
      - "127.0.0.1:8080:8080"
    environment:
      # Match these to your host user id on Linux if you hit permission
      # issues writing to the music folder (defaults suit Docker Desktop).
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Internal fixed-purpose service; the app itself has no Docker access.
      - BROWSER_CONTROLLER_URL=http://browser-controller:8090
    volumes:
      # Music library root (read-write: downloads land here, folders here
      # are browsable/indexable). Override with MUSIC_DIR in a .env file.
      - ${MUSIC_DIR:-..}:/music
      # Persistent audio fingerprint database
      - panako-db:/home/scripper/.panako/dbs
      # Scratch space for uploaded mixes
      - mixid-uploads:/uploads
      # Cookies uploaded via the GUI (or dumped by dump_cookies.py)
      - ./cookies:/cookies
      # Login-browser profile (read-only) — for one-click cookie capture
      - firefox-profile:/browser-profile:ro
      # Debug logfile (scripper.log), inspectable from the host
      - ./logs:/logs
    depends_on:
      browser-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # The only component with Docker socket access. It accepts fixed
  # start/stop/status operations for the login browser and no Docker args
  # from the web app, keeping media-processing code away from host control.
  browser-controller:
    build:
      context: .
      dockerfile: browser-controller.Dockerfile
    image: scripper-browser-controller:latest
    container_name: scripper-browser-controller
    environment:
      - LOGIN_BROWSER_PASSWORD=${LOGIN_BROWSER_PASSWORD:-}
      - LOGIN_BROWSER_IMAGE=jlesage/firefox@sha256:2bdbe30e355028eabb8a3a6f50a35a5d729e1de2376bc9c3c27c55fd2a7443d9
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  panako-db:
  mixid-uploads:
  firefox-profile:
    # Explicit name so the app can mount it into the login browser it spawns.
    name: scripper-firefox-profile
